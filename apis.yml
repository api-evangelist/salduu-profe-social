name: Salduu (Profe Social)
description: >-
  Salduu, operating as Profe Social at profe.social, is a 500 Global-backed
  social networking platform. The live host serves Mastodon's default robots.txt
  (Disallow /search, sitemap.xml.gz) and a Ruby on Rails error stack, indicating
  the platform runs on Mastodon / ActivityPub fediverse technology, so it exposes
  the standard Mastodon client REST API and ActivityPub federation endpoints
  under /api. Both the site and its API surface sit behind a Cloudflare managed
  challenge, so the instance's own instance metadata, OpenAPI, and developer
  pages could not be retrieved by a non-browser client during enrichment. This
  profile records what was directly observed via DNS/TLS/HTTP and well-known
  probes; the API contract itself remains to be captured once the challenge is
  cleared or the provider publishes a spec.
